name: keep-warm

# Amplify 서버 인스턴스를 깨워 둔다.
#
# 왜 필요한가 — 한동안 아무도 안 들어오면 서버가 잠들고, 다음 첫 요청이 콜드스타트를
# 통째로 문다(실측: /api/health 첫 호출 15.0초, 그 다음 0.26초 / 0.07초).
# 잠에서 깨는 건 인스턴스 단위라, 아무 라우트나 하나만 데워도 나머지가 같이 빨라진다
# (핑 직후 한동안 안 건드린 라우트들도 187ms / 266ms / 64ms 로 나왔다).
#
# 그래서 5분마다 /api/health 하나만 두드린다. 인증 불필요하고 민감정보도 없다.
# (app/api/health/route.ts 참고 — Cache-Control: no-store 라 매번 실제로 서버를 깨운다.)

on:
  schedule:
    # GitHub 의 최소 간격이 5분이다. 다만 이 스케줄은 best-effort 라 혼잡할 땐
    # 10~15분씩 밀리기도 한다. 그래서 한 번 실행될 때 1분 간격으로 여러 번 두드려
    # 다음 실행이 늦어도 빈틈이 줄어들게 한다.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 앞 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다(취소도 하지 않는다).
concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 헬스 핑 (1분 간격 5회)
        run: |
          set -u
          URL="https://gomijoshua.com/api/health"
          ok=0
          for i in 1 2 3 4 5; do
            out=$(curl -s -o /tmp/body -w '%{http_code} %{time_total}' --max-time 30 "$URL" || echo "000 timeout")
            code=${out%% *}
            secs=${out##* }
            echo "[$i] HTTP $code  ${secs}s  $(head -c 80 /tmp/body 2>/dev/null)"
            if [ "$code" = "200" ]; then ok=$((ok + 1)); fi
            if [ "$i" -lt 5 ]; then sleep 55; fi
          done
          echo "성공 $ok/5"
          # 5번 다 실패하면(=5분 내내 응답 없음) 워크플로를 실패시켜 알림이 가게 한다.
          # 한두 번 실패는 배포 교체 중일 수 있어 넘어간다.
          if [ "$ok" -eq 0 ]; then
            echo "::error::5분 동안 $URL 이 한 번도 200 을 주지 않았습니다."
            exit 1
          fi
