version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify 호스팅 환경 변수를 Next.js API/SSR에서 사용하려면
        # 빌드 전에 .env.production 에 써야 합니다.
        - env | grep -e MONGODB_URI >> .env.production || true
        - env | grep -e AUTH_SECRET >> .env.production || true
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        # 토스페이먼츠 시크릿(NEXT_PUBLIC_ 접두사 없음) — 포인트 충전 승인 API에 필요
        - env | grep -e TOSS_ >> .env.production || true
        # Dropbox 연동(주문 폴더 생성·파일 목록·임시 링크) — 이 줄이 없으면 콘솔에 값이 있어도
        # 런타임에 전달되지 않아 isDropboxConfigured() 가 false 가 되고 503 이 난다.
        - env | grep -e DROPBOX_ >> .env.production || true
        # Resend 메일 발송(주문 안내 메일)
        - env | grep -e RESEND_ >> .env.production || true
        # ANTHROPIC_API_KEY 는 의도적으로 제외한다 — 배포 서버에 키를 두지 않아야
        # 실수로 API 과금이 나가지 않는다(CLAUDE.md 의 Pro 전용 운영 방침).
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
      # 빌드 캐시는 배포 산출물에 들어갈 이유가 없다. 넣으면 230MB 한도를 넘어
      # 「빌드 성공」 뒤 CustomerError 로 배포가 통째로 실패한다.
      # (캐시 자체는 아래 cache.paths 로 따로 보존되므로 빌드 속도에는 영향이 없다)
      - '!cache/**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
